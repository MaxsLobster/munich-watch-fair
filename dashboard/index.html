<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <title>MWF Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌚</text></svg>">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ========== RESET & BASE ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-2: #1e1e1e;
      --surface-3: #282828;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --text-secondary: #888;
      --accent: #c8a45e;
      --accent-glow: rgba(200, 164, 94, 0.15);
      --messe: #e8a44a;
      --messe-bg: rgba(232, 164, 74, 0.08);
      --logistik: #5ba4e8;
      --logistik-bg: rgba(91, 164, 232, 0.08);
      --admin: #b07de8;
      --admin-bg: rgba(176, 125, 232, 0.08);
      --success: #4ade80;
      --radius: 16px;
      --radius-sm: 10px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    body {
      min-height: 100dvh;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 20px);
    }

    /* ========== HEADER ========== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
    }

    .header-inner {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1 span {
      color: var(--accent);
    }

    .sync-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .sync-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 6px #ef4444;
    }

    .sync-dot.syncing {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ========== MAIN CONTENT ========== */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px 16px 100px;
    }

    /* ========== COUNTDOWN ========== */
    .countdown-card {
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .countdown-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
    }

    .countdown-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .countdown-event {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .countdown-unit {
      text-align: center;
      background: var(--surface-3);
      border-radius: var(--radius-sm);
      padding: 14px 8px;
    }

    .countdown-number {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .countdown-suffix {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    .countdown-edit-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      font-size: 16px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }

    .countdown-edit-btn:hover {
      color: var(--text);
      background: var(--surface-3);
    }

    /* ========== DATE PICKER MODAL ========== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 360px;
    }

    .modal h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .modal input[type="datetime-local"] {
      width: 100%;
      padding: 12px;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
    }

    .modal input[type="datetime-local"]:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    .modal-actions button:active { opacity: 0.7; }

    .btn-cancel {
      background: var(--surface-3);
      color: var(--text);
    }

    .btn-save {
      background: var(--accent);
      color: #000;
    }

    /* ========== OVERALL PROGRESS ========== */
    .overall-progress {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .overall-ring {
      position: relative;
      width: 56px;
      height: 56px;
      flex-shrink: 0;
    }

    .overall-ring svg {
      transform: rotate(-90deg);
      width: 56px;
      height: 56px;
    }

    .overall-ring .ring-bg {
      fill: none;
      stroke: var(--surface-3);
      stroke-width: 5;
    }

    .overall-ring .ring-fill {
      fill: none;
      stroke: var(--accent);
      stroke-width: 5;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s ease;
    }

    .overall-percent {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
    }

    .overall-info {
      flex: 1;
    }

    .overall-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .overall-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* ========== FILTER PILLS ========== */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-pill {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .filter-pill:active { transform: scale(0.96); }

    .filter-pill.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-glow);
    }

    .filter-pill .count {
      display: inline-block;
      margin-left: 4px;
      font-size: 11px;
      opacity: 0.7;
    }

    /* ========== CATEGORY SECTIONS ========== */
    .category {
      margin-bottom: 20px;
    }

    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .category-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-stats {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .category-progress {
      height: 4px;
      background: var(--surface-3);
      border-radius: 2px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .category-progress-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    .category[data-category="messe"] .category-progress-fill { background: var(--messe); }
    .category[data-category="logistik"] .category-progress-fill { background: var(--logistik); }
    .category[data-category="admin"] .category-progress-fill { background: var(--admin); }

    /* ========== TASK CARDS ========== */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .task-card:active {
      transform: scale(0.985);
    }

    .task-card.completed {
      opacity: 0.5;
    }

    .task-card.completed .task-title {
      text-decoration: line-through;
    }

    .task-card[data-category="messe"]:hover,
    .task-card[data-category="messe"]:active { border-color: rgba(232, 164, 74, 0.3); }
    .task-card[data-category="logistik"]:hover,
    .task-card[data-category="logistik"]:active { border-color: rgba(91, 164, 232, 0.3); }
    .task-card[data-category="admin"]:hover,
    .task-card[data-category="admin"]:active { border-color: rgba(176, 125, 232, 0.3); }

    /* Checkbox */
    .task-check {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 2px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .task-card[data-category="messe"] .task-check { border-color: rgba(232, 164, 74, 0.4); }
    .task-card[data-category="logistik"] .task-check { border-color: rgba(91, 164, 232, 0.4); }
    .task-card[data-category="admin"] .task-check { border-color: rgba(176, 125, 232, 0.4); }

    .task-card.completed .task-check {
      border-color: var(--success);
      background: var(--success);
    }

    .task-check svg {
      width: 16px;
      height: 16px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .task-card.completed .task-check svg {
      opacity: 1;
    }

    .task-body {
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.3;
      transition: text-decoration 0.2s;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
    }

    .task-assignee {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--surface-3);
      color: var(--text-secondary);
    }

    /* ========== ADD TASK ========== */
    .add-task-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 12px 16px calc(var(--safe-bottom) + 12px);
      z-index: 100;
    }

    .add-task-inner {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
    }

    .add-task-input {
      flex: 1;
      padding: 12px 16px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-task-input::placeholder { color: var(--text-secondary); }
    .add-task-input:focus { border-color: var(--accent); }

    .add-task-btn {
      padding: 12px 18px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      line-height: 1;
    }

    .add-task-btn:active { opacity: 0.7; }

    /* ========== ADD TASK OPTIONS (inline row) ========== */
    .add-task-options {
      display: none;
      max-width: 600px;
      margin: 8px auto 0;
      gap: 8px;
      align-items: center;
    }

    .add-task-options.visible {
      display: flex;
    }

    .add-task-options select {
      flex: 1;
      padding: 8px 10px;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    /* ========== EMPTY STATE ========== */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 14px;
    }

    /* ========== ANIMATIONS ========== */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-card {
      animation: slideIn 0.25s ease;
    }

    /* ========== LOADING ========== */
    .loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 1000;
      transition: opacity 0.3s;
    }

    .loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--surface-3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ========== TOAST ========== */
    .toast {
      position: fixed;
      top: calc(var(--safe-top) + 70px);
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      white-space: nowrap;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <div class="loading-text">Verbinde mit Supabase...</div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <h1>&#9201; <span>MWF</span> Dashboard</h1>
      <div class="sync-indicator">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">Live</span>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="container" id="app">

    <!-- Countdown -->
    <div class="countdown-card">
      <button class="countdown-edit-btn" id="editDateBtn" aria-label="Datum bearbeiten">&#9998;</button>
      <div class="countdown-label">Countdown</div>
      <div class="countdown-event" id="countdownEvent">Munich Watch Fair</div>
      <div class="countdown-grid">
        <div class="countdown-unit">
          <div class="countdown-number" id="cdDays">--</div>
          <div class="countdown-suffix">Tage</div>
        </div>
        <div class="countdown-unit">
          <div class="countdown-number" id="cdHours">--</div>
          <div class="countdown-suffix">Std</div>
        </div>
        <div class="countdown-unit">
          <div class="countdown-number" id="cdMins">--</div>
          <div class="countdown-suffix">Min</div>
        </div>
        <div class="countdown-unit">
          <div class="countdown-number" id="cdSecs">--</div>
          <div class="countdown-suffix">Sek</div>
        </div>
      </div>
    </div>

    <!-- Overall Progress -->
    <div class="overall-progress">
      <div class="overall-ring">
        <svg viewBox="0 0 56 56">
          <circle class="ring-bg" cx="28" cy="28" r="24" />
          <circle class="ring-fill" id="progressRing" cx="28" cy="28" r="24"
            stroke-dasharray="150.796" stroke-dashoffset="150.796" />
        </svg>
        <div class="overall-percent" id="overallPercent">0%</div>
      </div>
      <div class="overall-info">
        <div class="overall-title" id="overallTitle">0 von 0 erledigt</div>
        <div class="overall-subtitle">Gesamtfortschritt</div>
      </div>
    </div>

    <!-- Filter pills -->
    <div class="filter-bar" id="filterBar">
      <button class="filter-pill active" data-filter="all">Alle <span class="count" id="countAll"></span></button>
      <button class="filter-pill" data-filter="messe">&#127914; Messe <span class="count" id="countMesse"></span></button>
      <button class="filter-pill" data-filter="logistik">&#128230; Logistik <span class="count" id="countLogistik"></span></button>
      <button class="filter-pill" data-filter="admin">&#128188; Admin <span class="count" id="countAdmin"></span></button>
    </div>

    <!-- Task categories will be rendered here -->
    <div id="taskContainer"></div>

  </main>

  <!-- Add task bar -->
  <div class="add-task-bar">
    <div class="add-task-inner">
      <input class="add-task-input" id="newTaskInput" type="text" placeholder="Neue Aufgabe..." enterkeyhint="done">
      <button class="add-task-btn" id="addTaskBtn">+</button>
    </div>
    <div class="add-task-options" id="addTaskOptions">
      <select id="newTaskCategory">
        <option value="messe">&#127914; Messe</option>
        <option value="logistik">&#128230; Logistik</option>
        <option value="admin">&#128188; Admin</option>
      </select>
      <select id="newTaskAssignee">
        <option value="Beide">Beide</option>
        <option value="Max">Max</option>
        <option value="Anna">Anna</option>
      </select>
    </div>
  </div>

  <!-- Date picker modal -->
  <div class="modal-overlay" id="dateModal">
    <div class="modal">
      <h3>Messe-Datum setzen</h3>
      <input type="datetime-local" id="dateInput">
      <div class="modal-actions">
        <button class="btn-cancel" id="dateCancel">Abbrechen</button>
        <button class="btn-save" id="dateSave">Speichern</button>
      </div>
    </div>
  </div>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>
    // ========== SUPABASE INIT ==========
    const SUPABASE_URL = 'https://urrugwhywrkrodsuzgyu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_e85oVw5CzNaEoUkz55sbwA_j6VwSjAw';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ========== STATE ==========
    let tasks = [];
    let messeDate = null;
    let activeFilter = 'all';
    let countdownInterval = null;

    // Category config
    const CATEGORIES = {
      messe: { emoji: '\u{1F3AA}', label: 'Messe-Vorbereitung', color: 'var(--messe)' },
      logistik: { emoji: '\u{1F4E6}', label: 'Logistik', color: 'var(--logistik)' },
      admin: { emoji: '\u{1F4BC}', label: 'Admin / Anna', color: 'var(--admin)' }
    };

    // ========== DOM REFS ==========
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    // ========== INIT ==========
    async function init() {
      try {
        // Load settings and tasks in parallel
        const [settingsRes, tasksRes] = await Promise.all([
          sb.from('settings').select('*'),
          sb.from('tasks').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: true })
        ]);

        if (settingsRes.error) throw settingsRes.error;
        if (tasksRes.error) throw tasksRes.error;

        // Parse settings
        const settings = {};
        (settingsRes.data || []).forEach(s => settings[s.key] = s.value);
        messeDate = settings.messe_date ? new Date(settings.messe_date) : new Date('2026-02-22T07:00:00+01:00');

        // Set tasks
        tasks = tasksRes.data || [];

        // Render everything
        renderTasks();
        startCountdown();
        updateOverallProgress();
        updateFilterCounts();

        // Subscribe to realtime changes
        subscribeToChanges();

        // Hide loading
        $('#loadingScreen').classList.add('hidden');

        setSyncStatus('live');
      } catch (err) {
        console.error('Init error:', err);
        setSyncStatus('offline');

        // Detect missing tables
        if (err && err.code === 'PGRST205') {
          const ls = $('#loadingScreen');
          ls.querySelector('.loading-spinner').style.display = 'none';
          ls.querySelector('.loading-text').innerHTML =
            '<strong style="color:var(--accent)">Tabellen fehlen</strong><br><br>' +
            'Bitte die Datei <code style="background:#222;padding:2px 6px;border-radius:4px">supabase-migration.sql</code><br>' +
            'im Supabase SQL-Editor ausf\u00fchren,<br>dann diese Seite neu laden.';
          ls.querySelector('.loading-text').style.lineHeight = '1.8';
          return;
        }

        const lt = $('#loadingScreen').querySelector('.loading-text');
        lt.innerHTML = 'Verbindungsfehler.<br><button onclick="location.reload()" style="margin-top:12px;padding:8px 20px;background:var(--accent);color:#000;border:none;border-radius:8px;font-family:inherit;font-weight:600;cursor:pointer">Neu laden</button>';
      }
    }

    // ========== REALTIME ==========
    function subscribeToChanges() {
      sb
        .channel('dashboard')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, (payload) => {
          handleTaskChange(payload);
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, (payload) => {
          handleSettingChange(payload);
        })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            setSyncStatus('live');
          } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
            setSyncStatus('offline');
          }
        });
    }

    function handleTaskChange(payload) {
      setSyncStatus('syncing');
      const { eventType, new: newRow, old: oldRow } = payload;

      if (eventType === 'INSERT') {
        // Only add if we don't already have it (from optimistic update)
        if (!tasks.find(t => t.id === newRow.id)) {
          tasks.push(newRow);
        }
      } else if (eventType === 'UPDATE') {
        const idx = tasks.findIndex(t => t.id === newRow.id);
        if (idx !== -1) tasks[idx] = newRow;
      } else if (eventType === 'DELETE') {
        tasks = tasks.filter(t => t.id !== oldRow.id);
      }

      renderTasks();
      updateOverallProgress();
      updateFilterCounts();

      setTimeout(() => setSyncStatus('live'), 500);
    }

    function handleSettingChange(payload) {
      if (payload.new && payload.new.key === 'messe_date') {
        messeDate = new Date(payload.new.value);
        startCountdown();
      }
    }

    // ========== SYNC STATUS ==========
    function setSyncStatus(status) {
      const dot = $('#syncDot');
      const label = $('#syncLabel');
      dot.className = 'sync-dot';
      if (status === 'live') { label.textContent = 'Live'; }
      else if (status === 'syncing') { dot.classList.add('syncing'); label.textContent = 'Sync...'; }
      else { dot.classList.add('offline'); label.textContent = 'Offline'; }
    }

    // ========== COUNTDOWN ==========
    function startCountdown() {
      if (countdownInterval) clearInterval(countdownInterval);
      updateCountdown();
      countdownInterval = setInterval(updateCountdown, 1000);
    }

    function updateCountdown() {
      if (!messeDate) return;
      const now = new Date();
      const diff = messeDate.getTime() - now.getTime();

      if (diff <= 0) {
        $('#cdDays').textContent = '0';
        $('#cdHours').textContent = '0';
        $('#cdMins').textContent = '0';
        $('#cdSecs').textContent = '0';
        $('#countdownEvent').textContent = 'Die Messe hat begonnen!';
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((diff % (1000 * 60)) / 1000);

      $('#cdDays').textContent = days;
      $('#cdHours').textContent = hours;
      $('#cdMins').textContent = mins;
      $('#cdSecs').textContent = secs;

      const dateStr = messeDate.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      $('#countdownEvent').textContent = `Munich Watch Fair \u2014 ${dateStr}`;
    }

    // ========== RENDER TASKS ==========
    function renderTasks() {
      const container = $('#taskContainer');
      const visibleCategories = activeFilter === 'all'
        ? ['messe', 'logistik', 'admin']
        : [activeFilter];

      let html = '';
      for (const cat of visibleCategories) {
        const catTasks = tasks.filter(t => t.category === cat);
        if (catTasks.length === 0 && activeFilter === 'all') continue;

        const completed = catTasks.filter(t => t.completed).length;
        const total = catTasks.length;
        const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
        const cfg = CATEGORIES[cat];

        html += `
          <div class="category" data-category="${cat}">
            <div class="category-header">
              <div class="category-title">${cfg.emoji} ${cfg.label}</div>
              <div class="category-stats">${completed}/${total}</div>
            </div>
            <div class="category-progress">
              <div class="category-progress-fill" style="width: ${pct}%"></div>
            </div>
            <div class="task-list">
              ${catTasks.map(t => renderTask(t)).join('')}
            </div>
          </div>
        `;
      }

      if (!html) {
        html = `
          <div class="empty-state">
            <div class="empty-state-icon">&#9989;</div>
            <p>Keine Aufgaben in dieser Kategorie</p>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function renderTask(task) {
      const checkSvg = `<svg viewBox="0 0 16 16" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3.5 8.5 6.5 11.5 12.5 5.5"/></svg>`;
      return `
        <div class="task-card ${task.completed ? 'completed' : ''}" data-id="${task.id}" data-category="${task.category}" onclick="toggleTask('${task.id}')">
          <div class="task-check">${checkSvg}</div>
          <div class="task-body">
            <div class="task-title">${escapeHtml(task.title)}</div>
            <div class="task-meta">
              <span class="task-assignee">${escapeHtml(task.assigned_to)}</span>
            </div>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ========== TOGGLE TASK ==========
    async function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      const newCompleted = !task.completed;

      // Optimistic update
      task.completed = newCompleted;
      renderTasks();
      updateOverallProgress();
      updateFilterCounts();

      // Haptic feedback on iOS
      if (navigator.vibrate) navigator.vibrate(10);

      const { error } = await sb
        .from('tasks')
        .update({ completed: newCompleted })
        .eq('id', id);

      if (error) {
        console.error('Toggle error:', error);
        task.completed = !newCompleted;
        renderTasks();
        updateOverallProgress();
        updateFilterCounts();
        showToast('Fehler beim Speichern');
      }
    }

    // ========== ADD TASK ==========
    async function addTask() {
      const input = $('#newTaskInput');
      const title = input.value.trim();
      if (!title) return;

      const category = $('#newTaskCategory').value;
      const assignedTo = $('#newTaskAssignee').value;

      // Optimistic insert
      const tempId = 'temp-' + Date.now();
      const newTask = {
        id: tempId,
        category,
        title,
        assigned_to: assignedTo,
        completed: false,
        sort_order: tasks.filter(t => t.category === category).length + 1,
        created_at: new Date().toISOString()
      };
      tasks.push(newTask);
      renderTasks();
      updateOverallProgress();
      updateFilterCounts();

      input.value = '';
      $('#addTaskOptions').classList.remove('visible');

      const { data, error } = await sb
        .from('tasks')
        .insert({
          category,
          title,
          assigned_to: assignedTo,
          completed: false,
          sort_order: newTask.sort_order
        })
        .select()
        .single();

      if (error) {
        console.error('Add error:', error);
        tasks = tasks.filter(t => t.id !== tempId);
        renderTasks();
        updateOverallProgress();
        updateFilterCounts();
        showToast('Fehler beim Erstellen');
      } else {
        // Replace temp with real
        const idx = tasks.findIndex(t => t.id === tempId);
        if (idx !== -1) tasks[idx] = data;
      }
    }

    // ========== PROGRESS ==========
    function updateOverallProgress() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

      // Ring
      const circumference = 2 * Math.PI * 24; // r=24
      const offset = circumference - (pct / 100) * circumference;
      $('#progressRing').style.strokeDashoffset = offset;

      $('#overallPercent').textContent = `${pct}%`;
      $('#overallTitle').textContent = `${completed} von ${total} erledigt`;
    }

    // ========== FILTER COUNTS ==========
    function updateFilterCounts() {
      const open = (cat) => tasks.filter(t => (cat === 'all' || t.category === cat) && !t.completed).length;
      $('#countAll').textContent = open('all') || '';
      $('#countMesse').textContent = open('messe') || '';
      $('#countLogistik').textContent = open('logistik') || '';
      $('#countAdmin').textContent = open('admin') || '';
    }

    // ========== FILTER CLICK ==========
    $('#filterBar').addEventListener('click', (e) => {
      const pill = e.target.closest('.filter-pill');
      if (!pill) return;
      $$('.filter-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      activeFilter = pill.dataset.filter;
      renderTasks();
    });

    // ========== ADD TASK EVENTS ==========
    $('#newTaskInput').addEventListener('focus', () => {
      $('#addTaskOptions').classList.add('visible');
    });

    $('#newTaskInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addTask();
      }
    });

    $('#addTaskBtn').addEventListener('click', addTask);

    // Close options when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.add-task-bar')) {
        $('#addTaskOptions').classList.remove('visible');
      }
    });

    // ========== DATE MODAL ==========
    $('#editDateBtn').addEventListener('click', () => {
      const m = $('#dateModal');
      if (messeDate) {
        const local = new Date(messeDate.getTime() - messeDate.getTimezoneOffset() * 60000);
        $('#dateInput').value = local.toISOString().slice(0, 16);
      }
      m.classList.add('active');
    });

    $('#dateCancel').addEventListener('click', () => {
      $('#dateModal').classList.remove('active');
    });

    $('#dateModal').addEventListener('click', (e) => {
      if (e.target === $('#dateModal')) {
        $('#dateModal').classList.remove('active');
      }
    });

    $('#dateSave').addEventListener('click', async () => {
      const val = $('#dateInput').value;
      if (!val) return;

      const newDate = new Date(val);
      messeDate = newDate;
      startCountdown();
      $('#dateModal').classList.remove('active');

      const { error } = await sb
        .from('settings')
        .upsert({ key: 'messe_date', value: newDate.toISOString(), updated_at: new Date().toISOString() });

      if (error) {
        console.error('Save date error:', error);
        showToast('Fehler beim Speichern');
      } else {
        showToast('Messe-Datum aktualisiert');
      }
    });

    // ========== TOAST ==========
    let toastTimeout;
    function showToast(msg) {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('visible');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => t.classList.remove('visible'), 2500);
    }

    // ========== PWA REGISTRATION ==========
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.warn('SW registration failed:', err);
      });
    }

    // ========== START ==========
    init();
  </script>

</body>
</html>
